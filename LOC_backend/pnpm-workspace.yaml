# Security floors for transitive dependencies whose parents pin older versions.
overrides:
  body-parser: '^2.4.0'
  fast-uri: '^3.1.9'
  multer: '^2.5.0'
  proxy-addr: '^2.0.8'
  qs: '^6.16.1'

allowBuilds:
  '@clerk/shared': false
  '@prisma/engines': false
  bcrypt: set this to true or false
  prisma: false
  unrs-resolver: false
