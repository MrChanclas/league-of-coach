# docker-compose.yml
# Reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from a local .env file
# next to this one (see .env.example) so no credential is hardcoded here.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in LOC_backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in LOC_backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in LOC_backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: