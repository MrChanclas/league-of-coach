# Included in every location that sets its own headers: nginx drops inherited
# add_header directives as soon as a block declares one of its own.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Report-only until it's been watched against real signed-in sessions: Clerk
# loads scripts and workers that a wrong rule would break for everybody.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://clerk.leagueofcoach.pro https://challenges.cloudflare.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.clerk.com https://ddragon.leagueoflegends.com https://raw.communitydragon.org; connect-src 'self' https://api.leagueofcoach.pro https://clerk.leagueofcoach.pro https://ddragon.leagueoflegends.com https://*.ingest.us.sentry.io; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
